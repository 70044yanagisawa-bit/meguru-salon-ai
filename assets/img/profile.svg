    <text x="88" y="254" font-family="Hiragino Kaku Gothic ProN, sans-serif" font-size="22" fill-opacity=".62">柳沢さんのポートレート。</text>
    <text x="88" y="298" font-family="Hiragino Kaku Gothic ProN, sans-serif" font-size="22" fill-opacity=".62">店内・自然光・胸上か膝上。</text>
